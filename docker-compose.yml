version: '3.8'

volumes:
  mymoviescoreDB:

networks:
  sqlserverNET:
  mymoviescoreNet:

services:

  sqlserver:
    image: "mcr.microsoft.com/mssql/server:2019-latest"
    container_name: sqlserver
    ports:
      - "1433:1433"
    volumes:
      - mymoviescoreDB:/var/lib/sqlserver
    networks:
      - sqlserverNET
    environment:
      ACCEPT_EULA: Y
      MSSQL_SA_PASSWORD: numsey#2021
      MSSQL_PID: EXPRESS
      
  mymoviescore:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mymoviescore
    networks:
      - sqlserverNET
      - mymoviescoreNet   
    ports:
     - "5000:80"
     - "5001:443"
    environment:
      - ConnectionStrings__MyMovieScoreCs=Server=sqlserver,1433;Database=MyMovieScore;User ID=sa;Password=numsey#2021;TrustServerCertificate=True
      - ExternalService__Key=${OMDB_API_KEY}
    depends_on:
      - sqlserver
    restart: on-failure
